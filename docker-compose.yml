services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: claudiaea/whysoserious-backend:local
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - HF_HUB_OFFLINE=1
      - TRANSFORMERS_OFFLINE=1
    restart: unless-stopped   

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: claudiaea/whysoserious-frontend:local
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
